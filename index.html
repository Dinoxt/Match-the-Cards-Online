<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Match - 2 Player & Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1818;
            height: 100dvh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer Frame mimicking the mobile tabletop arcade look */
        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 920px;
            display: flex;
            flex-direction: column;
            background-color: #463c3c;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            transition: border-radius 0.3s ease;
        }

        @media (min-width: 500px) {
            #game-wrapper {
                height: 94dvh;
                border-radius: 36px;
                border: 6px solid #2d2626;
            }
        }

        /* Top & Bottom Arcade Colored Bars */
        .arcade-bar {
            height: 54px;
            width: 100%;
            transition: background-color 0.4s ease;
            z-index: 10;
            flex-shrink: 0;
        }

        .arcade-bar-top {
            border-bottom: 12px solid #0a0a0a;
        }

        .arcade-bar-bottom {
            border-top: 12px solid #0a0a0a;
        }

        /* Neon Turn Glow Overlay */
        #turn-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .glow-red {
            box-shadow: inset 0 0 45px rgba(255, 102, 99, 0.55), inset 0 0 15px rgba(255, 102, 99, 0.9);
        }

        .glow-blue {
            box-shadow: inset 0 0 50px rgba(0, 210, 255, 0.65), inset 0 0 18px rgba(0, 225, 255, 0.95);
        }

        /* Turn Banner */
        #turn-banner {
            position: absolute;
            top: 68px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .banner-text {
            font-size: 2.35rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.28), 0 0 18px rgba(0, 210, 255, 0.5);
        }

        /* Left Side HUD Dock (Redesigned Score + Menu Button Below) */
        .left-hud-dock {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .score-card {
            background: rgba(34, 29, 29, 0.92);
            border: 3px solid #ffffff;
            border-radius: 22px;
            padding: 7px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
        }

        .score-badge {
            width: 34px;
            height: 34px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, opacity 0.25s ease;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        .score-badge-red {
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            border: 2px solid #ffffff;
        }

        .score-badge-blue {
            background: linear-gradient(135deg, #48cae4, #0096c7);
            border: 2px solid #ffffff;
        }

        .score-badge.active-turn {
            transform: scale(1.12);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.75);
            opacity: 1;
        }

        .score-badge.inactive-turn {
            opacity: 0.65;
            transform: scale(0.94);
        }

        .score-divider {
            width: 18px;
            height: 3px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.25);
        }

        /* Sleek Menu Symbol Button Below Score */
        .menu-fab-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffbe30 0%, #f59e0b 100%);
            border: 3px solid #ffffff;
            color: #2b2424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
        }

        .menu-fab-btn:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);
        }

        .menu-fab-btn:active {
            transform: translateY(2px) scale(0.93);
        }

        /* 3D Card Styles */
        .card-container {
            perspective: 900px;
            width: var(--card-size, 68px);
            height: var(--card-size, 68px);
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card-tilt-wrapper {
            width: 100%;
            height: 100%;
            transform: rotate(var(--tilt, 0deg));
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-container:hover .card-tilt-wrapper {
            transform: rotate(var(--tilt, 0deg)) scale(1.05);
        }

        .card-container:active .card-tilt-wrapper {
            transform: rotate(var(--tilt, 0deg)) scale(0.92);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-container.flipped .card-inner,
        .card-container.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 13px;
            border: 4.5px solid #ffffff;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22), 0 6px 12px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Yellow-Orange Card Back */
        .card-front {
            background-color: #ffbe30;
        }

        /* Revealed Card Face */
        .card-back {
            transform: rotateY(180deg);
            padding: 10px;
        }

        /* Matched pop animation */
        @keyframes matchPop {
            0% { transform: rotateY(180deg) scale(1); }
            40% { transform: rotateY(180deg) scale(1.18); }
            75% { transform: rotateY(180deg) scale(0.95); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-container.matched-anim .card-inner {
            animation: matchPop 0.55s ease forwards;
        }

        .card-container.matched {
            cursor: default;
        }

        /* Board Layout */
        #board-area {
            flex: 1;
            display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--board-gap, 11px);
            padding: 55px 38px 25px 38px;
            z-index: 15;
        }

        .board-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--board-gap, 11px);
        }

        /* Dynamic sizing for smaller or larger screens */
        @media (max-height: 700px) {
            :root {
                --card-size: 56px;
                --board-gap: 8px;
            }
            .banner-text {
                font-size: 1.85rem;
            }
            #turn-banner {
                top: 52px;
            }
            .arcade-bar {
                height: 40px;
            }
        }

        @media (min-height: 701px) and (max-height: 820px) {
            :root {
                --card-size: 64px;
                --board-gap: 10px;
            }
        }

        @media (min-height: 821px) {
            :root {
                --card-size: 72px;
                --board-gap: 12px;
            }
        }

        @media (max-width: 370px) {
            :root {
                --card-size: 54px;
                --board-gap: 8px;
            }
        }

        /* Floating +1 Score Feedback */
        .score-float {
            position: absolute;
            font-size: 2rem;
            font-weight: 700;
            pointer-events: none;
            z-index: 40;
            animation: floatUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            text-shadow: 0 3px 0 rgba(0,0,0,0.35);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.7); }
            30% { opacity: 1; transform: translateY(-15px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-48px) scale(1); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Neon Screen Glow -->
        <div id="turn-glow" class="glow-red"></div>

        <!-- Top Arcade Bar -->
        <div id="top-bar" class="arcade-bar arcade-bar-top" style="background-color: #f59578;"></div>

        <!-- Turn Indicator Banner -->
        <div id="turn-banner">
            <span id="turn-text" class="banner-text">Your Turn</span>
        </div>

        <!-- Left Side Dock: Redesigned Score + Menu Symbol Down Below -->
        <div class="left-hud-dock">
            <!-- Redesigned Score Capsule -->
            <div class="score-card" title="Match Score">
                <div id="badge-red" class="score-badge score-badge-red active-turn">
                    <span id="score-red">0</span>
                </div>
                <div class="score-divider"></div>
                <div id="badge-blue" class="score-badge score-badge-blue inactive-turn">
                    <span id="score-blue">0</span>
                </div>
            </div>

            <!-- Menu Symbol Button Below Score -->
            <button id="exit-btn" class="menu-fab-btn" aria-label="Open Game Menu" title="Menu">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
                    <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
                    <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
                    <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
                </svg>
            </button>
        </div>

        <!-- Main Card Grid (3 - 4 - 4 - 4 - 4 - 3 = 22 Cards / 11 Pairs) -->
        <div id="board-area"></div>

        <!-- Bottom Arcade Bar -->
        <div id="bottom-bar" class="arcade-bar arcade-bar-bottom" style="background-color: #f59578;"></div>

        <!-- Start / Pause / Game Over Modal Overlay -->
        <div id="modal-overlay" class="absolute inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-6 transition-opacity duration-300">
            <div class="bg-[#383030] border-4 border-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl transform transition-transform duration-300 scale-100">
                <!-- Title -->
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#ffbe30] border-4 border-white shadow-md mb-3 rotate-3">
                    <svg class="w-9 h-9 text-[#383030]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 id="modal-title" class="text-3xl font-bold text-white tracking-wide mb-1" style="text-shadow: 0 3px 0 rgba(0,0,0,0.35);">MEMORY MATCH</h1>
                <p id="modal-subtitle" class="text-sm text-gray-300 mb-5">Find matching pairs to score points! Getting a match gives you an extra turn.</p>

                <!-- Final Score Box (Hidden on initial menu) -->
                <div id="winner-score-box" class="hidden bg-[#2b2424] rounded-2xl p-3 mb-5 border-2 border-white/15 flex justify-around items-center">
                    <div>
                        <div id="p1-label" class="text-xs text-[#ff6b6b] uppercase">Red</div>
                        <div id="final-score-red" class="text-3xl font-bold text-[#ff6b6b]">0</div>
                    </div>
                    <div class="text-gray-500 text-xl font-bold">VS</div>
                    <div>
                        <div id="p2-label" class="text-xs text-[#00d2ff] uppercase">Blue</div>
                        <div id="final-score-blue" class="text-3xl font-bold text-[#00d2ff]">0</div>
                    </div>
                </div>

                <!-- Mode Selection -->
                <div class="space-y-3">
                    <button id="btn-vs-bot" class="w-full py-3.5 px-4 bg-[#00b4d8] hover:bg-[#0096c7] active:scale-95 text-white font-bold text-lg rounded-2xl border-4 border-white shadow-[0_5px_0_rgba(0,0,0,0.3)] transition flex items-center justify-center gap-2">
                        <span>🤖</span> Play vs Bot
                    </button>

                    <!-- Bot Difficulty Selector -->
                    <div class="flex bg-[#282222] p-1 rounded-xl border border-white/10">
                        <button data-diff="easy" class="diff-btn flex-1 py-1.5 text-xs rounded-lg text-gray-300 transition">Easy Bot</button>
                        <button data-diff="normal" class="diff-btn flex-1 py-1.5 text-xs rounded-lg bg-[#ffbe30] text-[#282222] font-bold shadow transition">Smart Bot</button>
                        <button data-diff="hard" class="diff-btn flex-1 py-1.5 text-xs rounded-lg text-gray-300 transition">Pro Bot</button>
                    </div>

                    <button id="btn-2p" class="w-full py-3.5 px-4 bg-[#ff6b6b] hover:bg-[#fa5252] active:scale-95 text-white font-bold text-lg rounded-2xl border-4 border-white shadow-[0_5px_0_rgba(0,0,0,0.3)] transition flex items-center justify-center gap-2 mt-2">
                        <span>👥</span> 2 Players (Pass & Play)
                    </button>

                    <button id="btn-resume" class="hidden w-full py-2.5 px-4 bg-gray-600 hover:bg-gray-500 active:scale-95 text-white font-bold text-base rounded-2xl border-2 border-white/60 transition mt-2">
                        Resume Current Game
                    </button>
                </div>
            </div>
        </div>
    </div>

                svg: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow">
                    <path d="M14 40 A36 36 0 0 0 86 40 Z" fill="#ffbe30" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M22 40 A28 28 0 0 0 78 40 Z" fill="#ff4d6d" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
                    <circle cx="40" cy="52" r="3" fill="#000"/>
                    <circle cx="50" cy="58" r="3" fill="#000"/>
                    <circle cx="60" cy="52" r="3" fill="#000"/>
                </svg>`
            }
        ];

        // Row counts matching the exact 3-4-4-4-4-3 = 22 cards layout in screenshot
        const ROW_LAYOUT = [3, 4, 4, 4, 4, 3];

        // Synthesized Web Audio Sound Effects (No external MP3 needed)
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playFlip() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            playMatch() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.07 + 0.24);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.07);
                        osc.stop(now + idx * 0.07 + 0.24);
                    });
                } catch (e) {}
            }

            playMiss() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.linearRampToValueAtTime(170, now + 0.18);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } catch (e) {}
            }

            playVictory() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.22, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.1 + 0.35);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.35);
                    });
                } catch (e) {}
            }
        }

        const sound = new SoundEngine();

        // Game State
        let gameMode = 'bot'; // 'bot' or '2p'
        let botDifficulty = 'normal'; // 'easy', 'normal', 'hard'
        let currentTurn = 'red'; // 'red' (Player 1) or 'blue' (Bot / Player 2)
        let scores = { red: 0, blue: 0 };
        let cards = [];
        let flippedIndices = [];
        let isBoardLocked = false;
        let gameActive = false;
        let botMemory = new Map(); // cardIndex -> cardTypeId
        let botTimer = null;

        // DOM Elements
        const boardArea = document.getElementById('board-area');
        const turnText = document.getElementById('turn-text');
        const turnGlow = document.getElementById('turn-glow');
        const topBar = document.getElementById('top-bar');
        const bottomBar = document.getElementById('bottom-bar');
        const scoreRedEl = document.getElementById('score-red');
        const scoreBlueEl = document.getElementById('score-blue');
        const badgeRedEl = document.getElementById('badge-red');
        const badgeBlueEl = document.getElementById('badge-blue');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const winnerScoreBox = document.getElementById('winner-score-box');
        const finalScoreRed = document.getElementById('final-score-red');
        const finalScoreBlue = document.getElementById('final-score-blue');
        const p1Label = document.getElementById('p1-label');
        const p2Label = document.getElementById('p2-label');
        const btnVsBot = document.getElementById('btn-vs-bot');
        const btn2P = document.getElementById('btn-2p');
        const btnResume = document.getElementById('btn-resume');
        const exitBtn = document.getElementById('exit-btn');
        const diffBtns = document.querySelectorAll('.diff-btn');

        // Difficulty Button Listeners
        diffBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                botDifficulty = btn.dataset.diff;
                diffBtns.forEach(b => {
                    b.className = 'diff-btn flex-1 py-1.5 text-xs rounded-lg text-gray-300 transition';
                });
                btn.className = 'diff-btn flex-1 py-1.5 text-xs rounded-lg bg-[#ffbe30] text-[#282222] font-bold shadow transition';
            });
        });

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startNewGame(mode) {
            clearTimeout(botTimer);
            gameMode = mode;
            currentTurn = 'red';
            scores = { red: 0, blue: 0 };
            flippedIndices = [];
            isBoardLocked = false;
            gameActive = true;
            botMemory.clear();

            updateScoreUI();
            updateTurnTheme();
            buildDeckAndRender();
            hideModal();
        }

        function buildDeckAndRender() {
            // Create 11 pairs = 22 cards
            const deckData = shuffleArray([...CARD_TYPES, ...CARD_TYPES]);
            cards = [];
            boardArea.innerHTML = '';

            let cardIndex = 0;
            ROW_LAYOUT.forEach(colsInRow => {
                const rowEl = document.createElement('div');
                rowEl.className = 'board-row';

                for (let c = 0; c < colsInRow; c++) {
                    const item = deckData[cardIndex];
                    const currentIdx = cardIndex;

                    // Organic slight rotation (-4.5deg to +4.5deg) like the reference screenshot
                    const randomTilt = ((Math.random() * 8) - 4).toFixed(2);

                    const cardEl = document.createElement('div');
                    cardEl.className = 'card-container';
                    cardEl.style.setProperty('--tilt', `${randomTilt}deg`);
                    cardEl.dataset.index = currentIdx;

                    cardEl.innerHTML = `
                        <div class="card-tilt-wrapper">
                            <div class="card-inner">
                                <div class="card-face card-front"></div>
                                <div class="card-face card-back" style="background-color: ${item.bg}">
                                    ${item.svg}
                                </div>
                            </div>
                        </div>
                    `;

                    cardEl.addEventListener('click', () => handleCardTap(currentIdx));
                    rowEl.appendChild(cardEl);

                    cards.push({
                        index: currentIdx,
                        typeId: item.id,
                        matched: false,
                        flipped: false,
                        element: cardEl
                    });

                    cardIndex++;
                }

                boardArea.appendChild(rowEl);
            });
        }

        function updateTurnTheme() {
            if (currentTurn === 'red') {
                // Red / Coral Player Theme (matches Screenshot 1)
                topBar.style.backgroundColor = '#f59578';
                bottomBar.style.backgroundColor = '#f59578';
                turnGlow.className = 'glow-red';
                turnText.textContent = gameMode === 'bot' ? "Your Turn" : "Red's Turn";
                turnText.style.textShadow = '0 4px 0 rgba(0, 0, 0, 0.28), 0 0 18px rgba(255, 107, 107, 0.5)';
                badgeRedEl.classList.add('active-turn');
                badgeRedEl.classList.remove('inactive-turn');
                badgeBlueEl.classList.add('inactive-turn');
                badgeBlueEl.classList.remove('active-turn');
            } else {
                // Blue / Cyan Bot or Player 2 Theme (matches Screenshot 2)
                topBar.style.backgroundColor = '#1ecbe1';
                bottomBar.style.backgroundColor = '#66b9d8';
                turnGlow.className = 'glow-blue';
                turnText.textContent = gameMode === 'bot' ? "Bot's Turn" : "Blue's Turn";
                turnText.style.textShadow = '0 4px 0 rgba(0, 0, 0, 0.28), 0 0 18px rgba(0, 225, 255, 0.65)';
                badgeBlueEl.classList.add('active-turn');
                badgeBlueEl.classList.remove('inactive-turn');
                badgeRedEl.classList.add('inactive-turn');
                badgeRedEl.classList.remove('active-turn');
            }
        }

        function updateScoreUI() {
            scoreRedEl.textContent = scores.red;
            scoreBlueEl.textContent = scores.blue;
        }

        function spawnFloatingScore(cardElement, player) {
            const rect = cardElement.getBoundingClientRect();
            const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();

            const floatEl = document.createElement('div');
            floatEl.className = 'score-float';
            floatEl.textContent = '+1';
            floatEl.style.color = player === 'red' ? '#ff6b6b' : '#00e5ff';
            floatEl.style.left = `${rect.left - wrapperRect.left + rect.width / 2 - 16}px`;
            floatEl.style.top = `${rect.top - wrapperRect.top}px`;

            document.getElementById('game-wrapper').appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 900);
        }

        function handleCardTap(index, isBotAction = false) {
            if (!gameActive || isBoardLocked) return;
            if (gameMode === 'bot' && currentTurn === 'blue' && !isBotAction) return;

            const card = cards[index];
            if (!card || card.flipped || card.matched) return;

            flipCard(index);
            flippedIndices.push(index);

            if (flippedIndices.length === 2) {
                isBoardLocked = true;
                checkForMatch();
            }
        }

        function flipCard(index) {
            const card = cards[index];
            card.flipped = true;
            card.element.classList.add('flipped');
            sound.playFlip();

            // Record into Bot's memory based on difficulty
            rememberCardForBot(index, card.typeId);
        }

        function rememberCardForBot(index, typeId) {
            const rememberChance = botDifficulty === 'easy' ? 0.38 : (botDifficulty === 'normal' ? 0.72 : 0.96);
            if (Math.random() <= rememberChance) {
                botMemory.set(index, typeId);
            }
        }

        function checkForMatch() {
            const [firstIdx, secondIdx] = flippedIndices;
            const firstCard = cards[firstIdx];
            const secondCard = cards[secondIdx];

            if (firstCard.typeId === secondCard.typeId) {
                // Match Found!
                setTimeout(() => {
                    firstCard.matched = true;
                    secondCard.matched = true;
                    firstCard.element.classList.add('matched', 'matched-anim');
                    secondCard.element.classList.add('matched', 'matched-anim');

                    botMemory.delete(firstIdx);
                    botMemory.delete(secondIdx);

                    scores[currentTurn]++;
                    updateScoreUI();
                    sound.playMatch();
                    spawnFloatingScore(secondCard.element, currentTurn);

                    flippedIndices = [];

                    // Check if all 11 pairs are found
                    if (scores.red + scores.blue === CARD_TYPES.length) {
                        setTimeout(endGame, 650);
                        return;
                    }

                    // Player keeps turn on match!
                    isBoardLocked = false;
                    if (gameMode === 'bot' && currentTurn === 'blue') {
                        scheduleBotTurn(650);
                    }
                }, 420);
            } else {
                // No Match
                setTimeout(() => {
                    sound.playMiss();
                    firstCard.flipped = false;
                    secondCard.flipped = false;
                    firstCard.element.classList.remove('flipped');
                    secondCard.element.classList.remove('flipped');

                    flippedIndices = [];
                    currentTurn = currentTurn === 'red' ? 'blue' : 'red';
                    updateTurnTheme();
                    isBoardLocked = false;

                    if (gameMode === 'bot' && currentTurn === 'blue') {
                        scheduleBotTurn(650);
                    }
                }, 880);
            }
        }

        function scheduleBotTurn(delay = 650) {
            clearTimeout(botTimer);
            botTimer = setTimeout(() => {
                if (!gameActive || currentTurn !== 'blue') return;
                executeBotMove();
            }, delay);
        }

        function executeBotMove() {
            const availableIndices = cards
                .filter(c => !c.matched && !c.flipped)
                .map(c => c.index);

            if (availableIndices.length < 2) return;

            let firstPick = null;
            let secondPick = null;

            // 1. Check if Bot already knows a full matching pair in memory
            const seenByType = {};
            for (const [idx, typeId] of botMemory.entries()) {
                if (cards[idx].matched) {
                    botMemory.delete(idx);
                    continue;
                }
                if (seenByType[typeId] !== undefined && seenByType[typeId] !== idx) {
                    firstPick = seenByType[typeId];
                    secondPick = idx;
                    break;
                }
                seenByType[typeId] = idx;
            }

            // 2. If no full pair is known, pick an unknown card first
            if (firstPick === null) {
                const unknownCards = availableIndices.filter(idx => !botMemory.has(idx));
                const pool = unknownCards.length > 0 ? unknownCards : availableIndices;
                firstPick = pool[Math.floor(Math.random() * pool.length)];
            }

            // Flip the first card
            handleCardTap(firstPick, true);

            // Decide second card after first card is revealed
            botTimer = setTimeout(() => {
                if (!gameActive || currentTurn !== 'blue') return;

                const firstType = cards[firstPick].typeId;

                // If secondPick wasn't predetermined, check if firstPick matches a card in botMemory
                if (secondPick === null) {
                    for (const [idx, typeId] of botMemory.entries()) {
                        if (idx !== firstPick && !cards[idx].matched && typeId === firstType) {
                            secondPick = idx;
                            break;
                        }
                    }
                }

                // Otherwise pick a random remaining available card
                if (secondPick === null || secondPick === firstPick || cards[secondPick].matched) {
                    const remaining = availableIndices.filter(i => i !== firstPick);
                    const unknownRemaining = remaining.filter(i => !botMemory.has(i));
                    const pool = unknownRemaining.length > 0 ? unknownRemaining : remaining;
                    secondPick = pool[Math.floor(Math.random() * pool.length)];
                }

                handleCardTap(secondPick, true);
            }, 680);
        }

        function endGame() {
            gameActive = false;
            sound.playVictory();

            p1Label.textContent = gameMode === 'bot' ? 'You' : 'Red';
            p2Label.textContent = gameMode === 'bot' ? 'Bot' : 'Blue';
            finalScoreRed.textContent = scores.red;
            finalScoreBlue.textContent = scores.blue;
            winnerScoreBox.classList.remove('hidden');
            btnResume.classList.add('hidden');

            if (scores.red > scores.blue) {
                modalTitle.textContent = gameMode === 'bot' ? 'YOU WIN! 🎉' : 'RED WINS! 🎉';
                modalSubtitle.textContent = 'Awesome memory skills! Want a rematch?';
            } else if (scores.blue > scores.red) {
                modalTitle.textContent = gameMode === 'bot' ? 'BOT WINS! 🤖' : 'BLUE WINS! 🎉';
                modalSubtitle.textContent = gameMode === 'bot' ? 'The Bot got the best of you this time!' : 'Great match! Play another round?';
            } else {
                modalTitle.textContent = "IT'S A DRAW!";
                modalSubtitle.textContent = 'So close! Play a tie-breaker match.';
            }

            showModal();
        }

        function showModal() {
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function hideModal() {
            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        // Button Event Listeners
        btnVsBot.addEventListener('click', () => startNewGame('bot'));
        btn2P.addEventListener('click', () => startNewGame('2p'));

        btnResume.addEventListener('click', () => {
            hideModal();
            if (gameMode === 'bot' && currentTurn === 'blue' && flippedIndices.length < 2) {
                scheduleBotTurn(500);
            }
        });

        exitBtn.addEventListener('click', () => {
            clearTimeout(botTimer);
            modalTitle.textContent = 'GAME PAUSED';
            modalSubtitle.textContent = 'Switch game mode or resume your current match.';
            winnerScoreBox.classList.remove('hidden');
            p1Label.textContent = gameMode === 'bot' ? 'You' : 'Red';
            p2Label.textContent = gameMode === 'bot' ? 'Bot' : 'Blue';
            finalScoreRed.textContent = scores.red;
            finalScoreBlue.textContent = scores.blue;

            if (gameActive) {
                btnResume.classList.remove('hidden');
            } else {
                btnResume.classList.add('hidden');
            }
            showModal();
        });

        // Initialize board preview in background on load
        window.onload = function () {
            buildDeckAndRender();
        };
    </script>
</body>
</html>
